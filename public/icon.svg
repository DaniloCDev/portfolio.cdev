<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#a855f7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Fundo escuro com borda suave -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#3f3f46" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Símbolo de código backend / prompt: < / > estilizado -->
  <g filter="url(#glow)">
    <!-- Chevrons < e > com barra / estilizada -->
    <path d="M22 23L13 32L22 41" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M42 23L51 32L42 41" stroke="url(#neonGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M35 19L29 45" stroke="#e9d5ff" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
